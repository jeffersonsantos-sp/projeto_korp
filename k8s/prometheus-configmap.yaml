apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: projeto-korp
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: 'http-server-projeto-korp'
        static_configs:
          - targets: ['http-server-projeto-korp:8080']
            labels:
              app: http-server-projeto-korp